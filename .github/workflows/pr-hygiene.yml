name: PR Hygiene

# Reusable. Labels a pull request by the areas it changes (config/labeler.yml) and enforces a
# conventional title: `type: subject` with a lowercase subject.
#
# Call it from the package repo on pull_request (types: opened, edited, synchronize, reopened):
#   jobs:
#     hygiene:
#       uses: cstuart-loomconnect/AIAssist-CICD/.github/workflows/pr-hygiene.yml@v1
#       permissions:
#         contents: read
#         pull-requests: write
#       with:
#         cicd-ref: v1
on:
  workflow_call:
    inputs:
      cicd-ref:
        description: Ref of AIAssist-CICD to load the label config from
        type: string
        default: v1

permissions:
  contents: read
  pull-requests: write

jobs:
  label:
    name: Label by area
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          repository: cstuart-loomconnect/AIAssist-CICD
          ref: ${{ inputs.cicd-ref }}
          path: .cicd
      - uses: actions/labeler@v7
        continue-on-error: true
        with:
          configuration-path: .cicd/config/labeler.yml

  title:
    name: PR title format
    # Dependabot titles are generated ("build(deps): Bump ...") with a capitalised subject
    if: github.actor != 'dependabot[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: amannn/action-semantic-pull-request@v6
        env:
          GITHUB_TOKEN: ${{ github.token }}
        with:
          types: |
            feat
            fix
            docs
            refactor
            test
            perf
            build
            ci
            chore
          requireScope: false
          subjectPattern: ^(?![A-Z]).+$
          subjectPatternError: The subject "{subject}" must start with a lowercase letter.
