name: PR Validation

# Reusable. Runs every check on a pull request between branches of a Salesforce package repo:
# formatting, LWC lint, SLDS, Code Analyzer, npm audit, naming conventions, then a scratch org
# deploy with all local Apex tests and a coverage gate. Posts one results comment on the PR.
#
# Call it from the package repo:
#   jobs:
#     validate:
#       uses: cstuart-loomconnect/AIAssist-CICD/.github/workflows/pr-validation.yml@v1
#       with:
#         cicd-ref: v1
#       secrets: inherit
#
# The workflow checks out the calling repo at the root and this repo into .cicd, so the
# scripts and config in this repo run against the package's force-app folder.
on:
  workflow_call:
    inputs:
      cicd-ref:
        description: Ref of AIAssist-CICD to load scripts and config from. Keep it the same as the @ref in `uses:`.
        type: string
        default: v1
      source-dir:
        description: Package source folder to check
        type: string
        default: force-app
      coverage:
        description: Minimum org-wide Apex coverage (%)
        type: number
        default: 75
      e2e:
        description: Run the Playwright browser tests in e2e/ after the Apex tests, when the repo has them
        type: boolean
        default: true
    secrets:
      DEVHUB_SFDX_AUTH_URL:
        required: true

permissions:
  contents: read

env:
  CICD_REPO: cstuart-loomconnect/AIAssist-CICD

jobs:
  detect:
    name: Detect changed metadata
    runs-on: ubuntu-latest
    outputs:
      has_apex: ${{ steps.scan.outputs.has_apex }}
      has_lwc: ${{ steps.scan.outputs.has_lwc }}
      has_source: ${{ steps.scan.outputs.has_source }}
    steps:
      - uses: actions/checkout@v7
      - id: scan
        env:
          SRC: ${{ inputs.source-dir }}
        run: |
          apex=$(find "$SRC" -name '*.cls' -o -name '*.trigger' | head -1)
          lwc=$(find "$SRC" -path '*/lwc/*' -name '*.js' -not -path '*/__tests__/*' | head -1)
          source=$(find "$SRC" -type f -not -name '.gitkeep' | head -1)
          {
            echo "has_apex=$([ -n "$apex" ] && echo true || echo false)"
            echo "has_lwc=$([ -n "$lwc" ] && echo true || echo false)"
            echo "has_source=$([ -n "$source" ] && echo true || echo false)"
          } >> "$GITHUB_OUTPUT"

  format-and-lint:
    name: Prettier + ESLint (LWC/Aura)
    needs: detect
    if: needs.detect.outputs.has_source == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm install --no-audit --no-fund
      - run: npm run prettier:verify
      - run: npx eslint "${{ inputs.source-dir }}/**/{aura,lwc}/**/*.js" --no-error-on-unmatched-pattern

  slds-validator:
    name: SLDS Validator
    needs: detect
    if: needs.detect.outputs.has_lwc == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      # Lints LWC HTML/CSS for SLDS styling-hook, deprecated class and hardcoded value issues.
      - name: SLDS lint
        run: npx --yes @salesforce-ux/slds-linter@latest lint "${{ inputs.source-dir }}"
      - name: SLDS report
        if: always()
        continue-on-error: true
        run: |
          mkdir -p slds-report
          npx --yes @salesforce-ux/slds-linter@latest report "${{ inputs.source-dir }}" --format sarif --output slds-report
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: slds-report
          path: slds-report/
          if-no-files-found: ignore

  code-analyzer:
    name: Salesforce Code Analyzer
    needs: detect
    if: needs.detect.outputs.has_source == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/checkout@v7
        with:
          repository: ${{ env.CICD_REPO }}
          ref: ${{ inputs.cicd-ref }}
          path: .cicd
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 21
      # The Flow engine in Code Analyzer needs Python 3.10+.
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - run: npm install --global @salesforce/cli
      - run: sf plugins install code-analyzer
      # Fails the job on severity 2 (High) or worse. Config lives in config/code-analyzer.yml.
      - name: Run Code Analyzer
        run: |
          sf code-analyzer run \
            --workspace "${{ inputs.source-dir }}" \
            --config-file .cicd/config/code-analyzer.yml \
            --rule-selector Recommended \
            --rule-selector AppExchange \
            --severity-threshold 2 \
            --view table \
            --output-file code-analyzer-results.html \
            --output-file code-analyzer-results.sarif \
            --output-file code-analyzer-results.json
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: code-analyzer-results
          path: code-analyzer-results.*
          if-no-files-found: ignore

  dependency-audit:
    name: Dependency audit (npm)
    needs: detect
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - run: npm install --package-lock-only --no-audit --no-fund
      - run: npm audit --audit-level=high
        continue-on-error: true

  naming-conventions:
    name: Naming conventions
    needs: detect
    if: needs.detect.outputs.has_source == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/checkout@v7
        with:
          repository: ${{ env.CICD_REPO }}
          ref: ${{ inputs.cicd-ref }}
          path: .cicd
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - run: node .cicd/scripts/check-naming.js "${{ inputs.source-dir }}" .cicd/config/naming-exceptions.txt

  scratch-org-tests:
    name: Scratch org + Apex tests
    needs: [detect, format-and-lint, code-analyzer, dependency-audit, naming-conventions]
    # Skip if a prerequisite was skipped for lack of source; fail if one failed.
    if: needs.detect.outputs.has_apex == 'true' && !cancelled() && !contains(needs.*.result, 'failure')
    # Nested calls must name the repo and ref in full; keep this in step with the release branch.
    uses: cstuart-loomconnect/AIAssist-CICD/.github/workflows/scratch-org-tests.yml@v1
    with:
      cicd-ref: ${{ inputs.cicd-ref }}
      source-dir: ${{ inputs.source-dir }}
      coverage: ${{ inputs.coverage }}
      e2e: ${{ inputs.e2e }}
    secrets:
      DEVHUB_SFDX_AUTH_URL: ${{ secrets.DEVHUB_SFDX_AUTH_URL }}

  pr-comment:
    name: Post results to PR
    needs: [code-analyzer, naming-conventions, scratch-org-tests]
    if: github.event_name == 'pull_request' && !cancelled()
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    steps:
      - uses: actions/checkout@v7
        with:
          repository: ${{ env.CICD_REPO }}
          ref: ${{ inputs.cicd-ref }}
          path: .cicd
      - uses: actions/download-artifact@v8
        continue-on-error: true
        with:
          pattern: '{code-analyzer-results,apex-test-results}'
      - uses: actions/github-script@v9
        # Fork PRs get a read-only token; don't fail the run over a missing comment.
        continue-on-error: true
        env:
          NEEDS: ${{ toJSON(needs) }}
        with:
          script: |
            const script = require(`${process.env.GITHUB_WORKSPACE}/.cicd/scripts/pr-comment.js`);
            await script({ github, context, needs: JSON.parse(process.env.NEEDS) });
