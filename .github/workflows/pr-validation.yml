name: PR Validation

# Reusable. Runs every check on a pull request between branches of a Salesforce package repo:
# formatting, LWC lint, LWC Jest tests, SLDS, Code Analyzer, naming conventions, API version consistency and
# hardcoded IDs/URLs, then one scratch org that runs all local Apex tests, the coverage gate and
# the browser tests.
#
# Call it from the package repo:
#   jobs:
#     validate:
#       uses: cstuart-loomconnect/LoomConnectAI-CICD/.github/workflows/pr-validation.yml@master
#       with:
#         cicd-ref: master
#       secrets: inherit
#
# The workflow checks out the calling repo at the root and this repo into .cicd, so the
# scripts and config in this repo run against the package's force-app folder.
#
# DEVHUB_SFDX_AUTH_URL is optional. A Dependabot pull request is not given the repo's Actions
# secrets, so when it is missing every check still runs except the scratch org tests, which
# are skipped with a notice. This keeps the Dev Hub login away from dependency updates.
on:
  workflow_call:
    inputs:
      cicd-ref:
        description: Ref of LoomConnectAI-CICD to load scripts and config from. Keep it the same as the @ref in `uses:`.
        type: string
        default: master
      source-dir:
        description: Package source folder to check
        type: string
        default: force-app
      coverage:
        description: Minimum org-wide Apex coverage (%)
        type: number
        default: 75
      e2e:
        description: Run the Playwright browser tests in e2e/ after the Apex tests, when the repo has them
        type: boolean
        default: true
    secrets:
      DEVHUB_SFDX_AUTH_URL:
        # Optional: without it the scratch org tests are skipped (see the note at the top).
        required: false

permissions:
  contents: read

env:
  CICD_REPO: cstuart-loomconnect/LoomConnectAI-CICD
  SLDS_LINTER_VERSION: 1.2.1

jobs:
  detect:
    name: Detect changed metadata
    runs-on: ubuntu-latest
    outputs:
      has_apex: ${{ steps.scan.outputs.has_apex }}
      has_lwc: ${{ steps.scan.outputs.has_lwc }}
      has_source: ${{ steps.scan.outputs.has_source }}
      has_devhub: ${{ steps.devhub.outputs.has_devhub }}
    steps:
      - uses: actions/checkout@v7
      - id: scan
        env:
          SRC: ${{ inputs.source-dir }}
        run: |
          apex=$(find "$SRC" -name '*.cls' -o -name '*.trigger' | head -1)
          lwc=$(find "$SRC" -path '*/lwc/*' -name '*.js' -not -path '*/__tests__/*' | head -1)
          source=$(find "$SRC" -type f -not -name '.gitkeep' | head -1)
          {
            echo "has_apex=$([ -n "$apex" ] && echo true || echo false)"
            echo "has_lwc=$([ -n "$lwc" ] && echo true || echo false)"
            echo "has_source=$([ -n "$source" ] && echo true || echo false)"
          } >> "$GITHUB_OUTPUT"
      # Secrets cannot be read in a job's if, so whether the Dev Hub login was passed in is worked out here.
      - id: devhub
        env:
          DEVHUB_SFDX_AUTH_URL: ${{ secrets.DEVHUB_SFDX_AUTH_URL }}
        run: |
          if [ -n "$DEVHUB_SFDX_AUTH_URL" ]; then
            echo "has_devhub=true" >> "$GITHUB_OUTPUT"
          else
            echo "has_devhub=false" >> "$GITHUB_OUTPUT"
            echo "::notice::No DEVHUB_SFDX_AUTH_URL secret was passed in (a Dependabot pull request is not given the repo's Actions secrets), so the scratch org tests are skipped. Every other check still runs."
          fi

  format-and-lint:
    name: Prettier + ESLint (LWC/Aura)
    needs: detect
    if: needs.detect.outputs.has_source == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm install --no-audit --no-fund
      - run: npm run prettier:verify
      - run: npx eslint "${{ inputs.source-dir }}/**/{aura,lwc}/**/*.js" --no-error-on-unmatched-pattern

  # Runs the LWC Jest tests (__tests__ folders) through the repo's own sfdx-lwc-jest, with coverage.
  # A repo with components but no tests yet passes, so adding this job breaks no caller.
  lwc-jest:
    name: LWC Jest tests
    needs: detect
    if: needs.detect.outputs.has_lwc == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm install --no-audit --no-fund
      - name: Run Jest
        run: npx sfdx-lwc-jest --coverage -- --ci --passWithNoTests
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: lwc-jest-coverage
          path: coverage/
          if-no-files-found: ignore

  slds-validator:
    name: SLDS Validator
    needs: detect
    if: needs.detect.outputs.has_lwc == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      # Lints LWC HTML/CSS for SLDS styling-hook, deprecated class and hardcoded value issues.
      # Pinned so a new linter release can't start failing PRs overnight; bump it deliberately.
      - name: SLDS lint
        run: npx --yes @salesforce-ux/slds-linter@${{ env.SLDS_LINTER_VERSION }} lint "${{ inputs.source-dir }}"
      - name: SLDS report
        if: always()
        continue-on-error: true
        run: |
          mkdir -p slds-report
          npx --yes @salesforce-ux/slds-linter@${{ env.SLDS_LINTER_VERSION }} report "${{ inputs.source-dir }}" --format sarif --output slds-report
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: slds-report
          path: slds-report/
          if-no-files-found: ignore

  code-analyzer:
    name: Salesforce Code Analyzer
    needs: detect
    if: needs.detect.outputs.has_source == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/checkout@v7
        with:
          repository: ${{ env.CICD_REPO }}
          ref: ${{ inputs.cicd-ref }}
          path: .cicd
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 21
      # The Flow engine in Code Analyzer needs Python 3.10+.
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - run: npm install --global @salesforce/cli
      - run: sf plugins install code-analyzer
      # Fails the job on severity 2 (High) or worse. Config lives in config/code-analyzer.yml.
      - name: Run Code Analyzer
        run: |
          sf code-analyzer run \
            --workspace "${{ inputs.source-dir }}" \
            --config-file .cicd/config/code-analyzer.yml \
            --rule-selector Recommended \
            --severity-threshold 2 \
            --view table \
            --output-file code-analyzer-results.html \
            --output-file code-analyzer-results.sarif \
            --output-file code-analyzer-results.json
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: code-analyzer-results
          path: code-analyzer-results.*
          if-no-files-found: ignore

  naming-conventions:
    name: Naming conventions
    needs: detect
    if: needs.detect.outputs.has_source == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/checkout@v7
        with:
          repository: ${{ env.CICD_REPO }}
          ref: ${{ inputs.cicd-ref }}
          path: .cicd
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - run: node .cicd/scripts/check-naming.js "${{ inputs.source-dir }}" .cicd/config/naming-exceptions.txt

  api-version:
    name: API version consistency
    needs: detect
    if: needs.detect.outputs.has_source == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/checkout@v7
        with:
          repository: ${{ env.CICD_REPO }}
          ref: ${{ inputs.cicd-ref }}
          path: .cicd
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - run: node .cicd/scripts/check-api-version.js "${{ inputs.source-dir }}" sfdx-project.json

  hardcoded-references:
    name: Hardcoded IDs and URLs
    needs: detect
    if: needs.detect.outputs.has_source == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/checkout@v7
        with:
          repository: ${{ env.CICD_REPO }}
          ref: ${{ inputs.cicd-ref }}
          path: .cicd
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - run: node .cicd/scripts/check-hardcoded.js "${{ inputs.source-dir }}" .cicd/config/hardcoded-exceptions.txt

  # One scratch org for everything that needs an org: Apex tests and coverage, then the browser
  # tests against the same deploy.
  scratch-org-tests:
    name: Scratch org + Apex and browser tests
    needs: [detect, format-and-lint, lwc-jest, code-analyzer, naming-conventions, api-version, hardcoded-references]
    # Skip if a prerequisite was skipped for lack of source, or no Dev Hub login was passed in; fail if one failed.
    if: needs.detect.outputs.has_apex == 'true' && needs.detect.outputs.has_devhub == 'true' && !cancelled() && !contains(needs.*.result, 'failure')
    # Nested calls must name the repo and ref in full; keep this in step with the release branch.
    uses: cstuart-loomconnect/LoomConnectAI-CICD/.github/workflows/scratch-org-tests.yml@master
    with:
      cicd-ref: ${{ inputs.cicd-ref }}
      source-dir: ${{ inputs.source-dir }}
      coverage: ${{ inputs.coverage }}
      e2e: ${{ inputs.e2e }}
    secrets:
      DEVHUB_SFDX_AUTH_URL: ${{ secrets.DEVHUB_SFDX_AUTH_URL }}
